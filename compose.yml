services:
  oscarplus-mcp:
    build: .
    restart: unless-stopped
    env_file: .env
    ports:
      - "${LAN_BIND_IP:-127.0.0.1}:${PORT:-3100}:${PORT:-3100}"
    volumes:
      - ./data:/data
      - ./auth-profile:/auth-profile
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:'+(process.env.PORT||3100)+'/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
